[project]
name = "steamdata"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Tony", email = "tonyiish223@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
